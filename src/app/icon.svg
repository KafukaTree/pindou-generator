<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" shape-rendering="crispEdges">
<rect width="512" height="512" rx="92.16" fill="#FBF3E4"/>
<svg x="30.72" y="40.96" width="450.56" height="450.56" viewBox="10 20 140 118" preserveAspectRatio="xMidYMid meet"><style>
.mascot-bob { animation: mascot-bob 2.4s steps(1, end) infinite; }
.mascot-blink { animation: mascot-blink 5.2s steps(1, end) infinite; }
.mascot-wing-l { animation: mascot-flap 1.6s steps(1, end) infinite; }
.mascot-wing-r { animation: mascot-flap 1.6s steps(1, end) infinite 0.1s; }
.mascot-float { animation: mascot-drift 2.8s steps(6, end) infinite; }
.mascot-pen { animation: mascot-jot 0.9s steps(1, end) infinite; }
.mascot-foot-a { animation: mascot-stride 0.9s steps(1, end) infinite; }
.mascot-foot-b { animation: mascot-stride 0.9s steps(1, end) infinite 0.45s; }

/* 跳绳：4 帧叠在同一位置，靠负延迟错开，任意时刻只有一帧可见。
   一整圈 0.9s（≈66rpm），每帧 0.225s —— 再慢就不像绳在转了。 */
.mascot-rope-0 { animation: mascot-rope-frame 0.9s steps(1, end) infinite; }
.mascot-rope-1 { animation: mascot-rope-frame 0.9s steps(1, end) infinite -0.225s; }
.mascot-rope-2 { animation: mascot-rope-frame 0.9s steps(1, end) infinite -0.45s; }
.mascot-rope-3 { animation: mascot-rope-frame 0.9s steps(1, end) infinite -0.675s; }

/* 戴耳机：不是摇身子，是跟着拍子点头 —— 慢半拍的 1 格上下。
   只给 headphones 用，别的姿势还是原来的 mascot-bob。 */
.mascot-nod { animation: mascot-nod 0.8s steps(1, end) infinite; }

@keyframes mascot-bob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
@keyframes mascot-blink {
  0%, 93%, 100% { opacity: 1; }
  94%, 97% { opacity: 0; }
}
@keyframes mascot-flap {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
@keyframes mascot-drift {
  0% { transform: translate(0, 0); opacity: 0; }
  20% { opacity: 1; }
  100% { transform: translate(12px, -32px); opacity: 0; }
}
@keyframes mascot-jot {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(-4px, 4px); }
}
@keyframes mascot-stride {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}
@keyframes mascot-rope-frame {
  0%, 24.9% { opacity: 1; }
  25%, 100% { opacity: 0; }
}
@keyframes mascot-nod {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(4px); }
}
@media (prefers-reduced-motion: reduce) {
  .mascot-bob, .mascot-blink, .mascot-wing-l, .mascot-wing-r, .mascot-float,
  .mascot-pen, .mascot-foot-a, .mascot-foot-b, .mascot-hover,
  .mascot-walker, .mascot-nod,
  .mascot-rope-0, .mascot-rope-1, .mascot-rope-2, .mascot-rope-3 {
    animation: none;
  }
  /* 定格时绳子只留第 0 帧，四帧全显示会叠成一团 */
  .mascot-rope-1, .mascot-rope-2, .mascot-rope-3 { display: none; }
}
</style><g><rect x="76" y="24" width="8" height="4" fill="#FFE395"></rect><rect x="60" y="28" width="8" height="4" fill="#FFE395"></rect><rect x="76" y="28" width="8" height="4" fill="#FFE395"></rect><rect x="92" y="28" width="8" height="4" fill="#FFE395"></rect><rect x="64" y="32" width="8" height="4" fill="#FFE395"></rect><rect x="76" y="32" width="8" height="4" fill="#FFE395"></rect><rect x="88" y="32" width="8" height="4" fill="#FFE395"></rect><rect x="68" y="36" width="24" height="4" fill="#FFE395"></rect><rect x="68" y="40" width="24" height="4" fill="#FFE395"></rect><rect x="44" y="44" width="76" height="4" fill="#FFE395"></rect><rect x="44" y="48" width="76" height="4" fill="#FFE395"></rect><rect x="44" y="52" width="76" height="4" fill="#FFE395"></rect><rect x="44" y="56" width="76" height="4" fill="#FFE395"></rect><rect x="40" y="60" width="84" height="4" fill="#FFE395"></rect><rect x="40" y="64" width="84" height="4" fill="#FFE395"></rect><rect x="36" y="68" width="48" height="4" fill="#FFE395"></rect><rect x="84" y="68" width="16" height="4" fill="#1D1414"></rect><rect x="100" y="68" width="28" height="4" fill="#FFE395"></rect><rect x="36" y="72" width="12" height="4" fill="#FFE395"></rect><rect x="48" y="72" width="20" height="4" fill="#1D1414"></rect><rect x="68" y="72" width="60" height="4" fill="#FFE395"></rect><rect x="36" y="76" width="92" height="4" fill="#FFE395"></rect><rect x="36" y="80" width="92" height="4" fill="#FFE395"></rect><rect x="36" y="84" width="16" height="4" fill="#FFE395"></rect><rect x="56" y="84" width="8" height="4" fill="#FFE395"></rect><rect x="68" y="84" width="20" height="4" fill="#FFE395"></rect><rect x="92" y="84" width="8" height="4" fill="#FFE395"></rect><rect x="104" y="84" width="24" height="4" fill="#FFE395"></rect><rect x="40" y="88" width="12" height="4" fill="#FFE395"></rect><rect x="68" y="88" width="20" height="4" fill="#FFE395"></rect><rect x="104" y="88" width="20" height="4" fill="#FFE395"></rect><rect x="40" y="92" width="16" height="4" fill="#FFE395"></rect><rect x="56" y="92" width="32" height="4" fill="#F77C31"></rect><rect x="88" y="92" width="36" height="4" fill="#FFE395"></rect><rect x="36" y="96" width="4" height="4" fill="#FFE395"></rect><rect x="40" y="96" width="56" height="4" fill="#F77C31"></rect><rect x="96" y="96" width="32" height="4" fill="#FFE395"></rect><rect x="32" y="100" width="68" height="4" fill="#F77C31"></rect><rect x="100" y="100" width="24" height="4" fill="#FFE395"></rect><rect x="32" y="104" width="68" height="4" fill="#F77C31"></rect><rect x="100" y="104" width="24" height="4" fill="#FFE395"></rect><rect x="36" y="108" width="60" height="4" fill="#F77C31"></rect><rect x="96" y="108" width="24" height="4" fill="#FFE395"></rect><rect x="44" y="112" width="4" height="4" fill="#FFE395"></rect><rect x="48" y="112" width="36" height="4" fill="#F77C31"></rect><rect x="84" y="112" width="36" height="4" fill="#FFE395"></rect><rect x="44" y="116" width="12" height="4" fill="#FFE395"></rect><rect x="56" y="116" width="24" height="4" fill="#FD543D"></rect><rect x="80" y="116" width="40" height="4" fill="#FFE395"></rect><rect x="44" y="120" width="20" height="4" fill="#FFE395"></rect><rect x="64" y="120" width="12" height="4" fill="#FD543D"></rect><rect x="76" y="120" width="44" height="4" fill="#FFE395"></rect><rect x="56" y="124" width="12" height="4" fill="#F77C31"></rect><rect x="92" y="124" width="12" height="4" fill="#F77C31"></rect><rect x="56" y="128" width="12" height="4" fill="#F77C31"></rect><rect x="92" y="128" width="12" height="4" fill="#F77C31"></rect><g><rect x="16" y="68" width="8" height="4" fill="#FEBE7D"></rect><rect x="12" y="72" width="16" height="4" fill="#FEBE7D"></rect><rect x="12" y="76" width="16" height="4" fill="#FEBE7D"></rect><rect x="12" y="80" width="20" height="4" fill="#FEBE7D"></rect><rect x="8" y="84" width="28" height="4" fill="#FEBE7D"></rect><rect x="8" y="88" width="32" height="4" fill="#FEBE7D"></rect><rect x=